      background: var(--card2); color: var(--text); font-family: inherit; font-size: 0.98rem; font-weight: 500; }
    .bt-input { width: 100%; margin-top: 0.6rem; }
    .bt-slider { display: grid; grid-template-columns: 8rem 1fr 2rem; align-items: center;
      gap: 0.7rem; margin: 0.6rem 0; color: var(--muted); font-size: 0.88rem; }
    .bt-slider input { accent-color: var(--accent); }
    .bt-slider output { font-weight: 800; color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
    .bt-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .bt-chip { padding: 0.45rem 0.85rem; border-radius: 999px; border: 1px solid var(--line);
      background: var(--card2); color: var(--muted); font-weight: 600; font-size: 0.85rem; cursor: pointer; }
    .bt-chip:hover { border-color: var(--accent); color: var(--accent); }

    /* ---- Instructions ---- */
    .bt-instr-step { color: var(--muted); font-size: 0.78rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.08em; }
    .bt-instr-list { margin: 0.6rem 0 1.4rem; padding-left: 1.2rem; }
    .bt-instr-list li { font-size: 1.05rem; line-height: 1.65; margin-bottom: 0.55rem; }
    .bt-keys { color: var(--muted); font-size: 0.88rem; font-weight: 600; }
    .bt-keys.big { display: inline-block; background: var(--card2); border: 1px solid var(--line);
      border-radius: 10px; padding: 0.6rem 1rem; font-size: 1rem; color: var(--text); margin-bottom: 1rem; }

    /* ---- Running screen ---- */
    .bt.running { max-width: 640px; }
    .bt-runhead { margin-bottom: 1.6rem; }
    .bt-runprog { font-size: 0.95rem; color: var(--muted); margin-bottom: 0.5rem; font-variant-numeric: tabular-nums; }
    .bt-runprog b { color: var(--text); }
    .bt-runbar { height: 6px; background: var(--card2); border-radius: 999px; overflow: hidden; }
    .bt-runbar-fill { height: 100%; background: var(--accent); transition: width 0.3s ease; }
    .bt-runmeta { display: flex; justify-content: space-between; margin-top: 0.45rem;
      color: var(--muted); font-size: 0.82rem; font-variant-numeric: tabular-nums; }
    .bt-runfoot { display: flex; justify-content: space-between; align-items: center;
      margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--line); }

    .bt-stage { position: relative; min-height: 300px; display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start; text-align: center; padding-top: 1.5rem; }
    .bt-status { font-size: 2.4rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2;
      min-height: 1.3em; color: var(--text); }
    .bt-promptline { color: var(--muted); font-size: 1rem; line-height: 1.5; min-height: 1.6em; margin-top: 0.5rem; }
    .bt-go { font-weight: 700; color: var(--accent); }
    .bt-pausing { color: #b45309; font-weight: 700; }
    .bt-feedback { min-height: 1.6em; font-size: 1rem; font-weight: 700; margin-top: 0.4rem; }
    .bt-feedback.ok { color: var(--good); }
    .bt-feedback.bad { color: var(--bad); }
    /* Answer receipt: one identical pulse whatever the answer was. It confirms
       the keypress landed without leaking whether it was right. */
    .bt-receipt { position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 10px; height: 10px; border-radius: 50%; background: var(--accent); opacity: 0; }
    .bt-receipt.on { animation: btPulse 0.42s ease-out; }
    @keyframes btPulse { 0% { opacity: 0.9; transform: translateX(-50%) scale(0.5); } 100% { opacity: 0; transform: translateX(-50%) scale(2.4); } }

    .bt-choices { display: none; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-top: 1.8rem; }
    .bt-choices.on { display: flex; }
    .bt-choice { display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
      min-width: 9rem; padding: 1.3rem 1.6rem; border-radius: 16px; border: 2px solid var(--line);
      background: var(--card); color: var(--text); font-family: inherit; font-size: 1.15rem;
      font-weight: 700; cursor: pointer; text-transform: capitalize; }
    .bt-choice:hover { border-color: var(--accent); }
    .bt-choice span { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.09em;
      color: var(--muted); text-transform: uppercase; }

    .bt-pcwrap { display: none; width: 100%; max-width: 460px; margin-top: 1.6rem; }
    .bt-pcwrap.on { display: block; }
    .bt-pcneed { color: var(--muted); font-size: 0.85rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.5rem; }
    .bt-pcgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.45rem; }
    .bt-pc { padding: 1rem 0.3rem; border-radius: 12px; border: 2px solid var(--line);
      background: var(--card); color: var(--text); font-family: inherit; font-size: 1.05rem;
      font-weight: 700; cursor: pointer; }
    .bt-pc:hover { border-color: var(--accent); }
    .bt-pc.picked { background: var(--accent); color: #fff; border-color: var(--accent); }
    .bt-entered { margin-top: 0.7rem; font-family: ui-monospace, Menlo, monospace;
      font-size: 1.25rem; letter-spacing: 0.08em; color: var(--accent); min-height: 1.5em; }

    .bt-break, .bt-done { text-align: center; padding-top: 2.5rem; }
    .bt-break .bt-sub, .bt-done .bt-sub { max-width: 520px; margin: 0 auto 1.6rem; }
    .bt-break .bt-runbar { max-width: 380px; margin: 0 auto 1.6rem; }
    .bt-done-mark { width: 4rem; height: 4rem; margin: 0 auto 1.2rem; border-radius: 50%;
      background: rgba(22,163,74,0.12); color: var(--accent); font-size: 2rem; font-weight: 800;
      display: flex; align-items: center; justify-content: center; }

    /* =========================================================
       Results dashboard — this one is allowed to look good,
       because frames of it may end up in the video.
       ========================================================= */
    .rs { max-width: 860px; margin: 0 auto; }
    .rs-loading, .rs-empty { color: var(--muted); font-size: 0.95rem; padding: 1.2rem 0; }
    .rs-empty.big { text-align: center; padding: 4rem 1rem; font-size: 1.05rem; }
    .rs-top { display: flex; align-items: center; gap: 1rem; padding: 0.6rem 0 1.2rem; flex-wrap: wrap; }
    .rs-back { background: none; border: none; color: var(--muted); font-size: 0.9rem;
      font-weight: 600; cursor: pointer; padding: 0.4rem 0; }
    .rs-title-wrap { flex: 1; min-width: 140px; }
    .rs-title { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.03em; margin: 0; }
    .rs-meta { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
    .rs-actions { display: flex; gap: 0.5rem; }
    .rs-btn { padding: 0.55rem 1rem; border-radius: 10px; border: 1px solid var(--line);
      background: var(--card); color: var(--text); font-family: inherit; font-size: 0.85rem;
      font-weight: 700; cursor: pointer; }
    .rs-btn:hover { border-color: var(--accent); color: var(--accent); }

    .rs-tabs { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap;
      border-bottom: 1px solid var(--line); padding-bottom: 0.6rem; margin-bottom: 1.4rem; }
    .rs-tab { padding: 0.45rem 0.95rem; border-radius: 999px; border: 1px solid transparent;
      background: none; color: var(--muted); font-family: inherit; font-size: 0.88rem;
      font-weight: 700; cursor: pointer; }
    .rs-tab.on { background: var(--accent); color: #fff; }
    .rs-xtoggle { margin-left: auto; display: flex; align-items: center; gap: 0.4rem;
      color: var(--muted); font-size: 0.82rem; cursor: pointer; }
    .rs-xtoggle input { accent-color: var(--accent); }

    .rs-panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px;
      padding: 1.3rem 1.4rem; margin-bottom: 1.2rem; box-shadow: var(--shadow); }
    .rs-h2 { font-size: 1.12rem; font-weight: 800; letter-spacing: -0.015em; margin: 0 0 0.3rem; }
    .rs-panel .rs-sub { color: var(--muted); font-size: 0.87rem; line-height: 1.55; margin: 0 0 1rem; max-width: 62ch; }

    .rs-chart { width: 100%; overflow-x: auto; }
    .rs-chart svg { width: 100%; height: auto; min-width: 460px; display: block; }
    .rs-chart.wide svg { min-width: 480px; max-width: 520px; margin: 0 auto; }
    .rs-tick { font-size: 11px; fill: #64748b; font-family: ui-monospace, Menlo, monospace; }
    .rs-xtick { font-size: 11.5px; fill: #475569; font-weight: 600; }
    .rs-ylabel { font-size: 11.5px; fill: #64748b; font-weight: 600; }
    .rs-cellnum { font-size: 10.5px; font-weight: 700; font-family: ui-monospace, Menlo, monospace; }
    .rs-legend { display: flex; gap: 1.1rem; flex-wrap: wrap; justify-content: center;
      margin-top: 0.6rem; color: var(--muted); font-size: 0.82rem; font-weight: 600; }
    .rs-legend i { display: inline-block; width: 0.75rem; height: 0.75rem; border-radius: 3px;
      margin-right: 0.35rem; vertical-align: -1px; }

    .rs-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.8rem; }
    .rs-tile { background: var(--card2); border: 1px solid var(--line); border-radius: 14px; padding: 0.95rem 1rem; }
    .rs-tile-l { color: var(--muted); font-size: 0.76rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em; line-height: 1.3; }
    .rs-tile-v { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.03em; margin-top: 0.3rem;
      font-variant-numeric: tabular-nums; }
    .rs-tile-v span { font-size: 0.85rem; font-weight: 600; color: var(--muted); letter-spacing: 0; }
    .rs-tile-d { font-size: 0.78rem; font-weight: 700; margin-top: 0.2rem; color: var(--muted); }
    .rs-tile-d.up { color: var(--good); }
    .rs-tile-d.down { color: #b45309; }

    .rs-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    .rs-table th { text-align: left; color: var(--muted); font-size: 0.72rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.06em; padding: 0.5rem 0.6rem;
      border-bottom: 1px solid var(--line); white-space: nowrap; }
    .rs-table td { padding: 0.55rem 0.6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    .rs-table tr:last-child td { border-bottom: none; }
    .rs-table.mono td { font-family: ui-monospace, Menlo, monospace; font-size: 0.8rem; white-space: nowrap; }
    .rs-table td.ok { color: var(--good); font-weight: 800; }
    .rs-table td.bad { color: var(--bad); font-weight: 800; }
    .rs-dim { color: var(--muted); font-size: 0.82rem; }
    .rs-stim { max-width: 320px; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
    .rs-scroll { overflow-x: auto; max-height: 620px; overflow-y: auto; }
    .rs-filters { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.9rem; }
    .rs-filters label { color: var(--muted); font-size: 0.82rem; font-weight: 700;
      display: flex; align-items: center; gap: 0.4rem; }
    .rs-filters select { padding: 0.4rem 0.7rem; border-radius: 8px; border: 1px solid var(--line);
      background: var(--card2); color: var(--text); font-family: inherit; font-size: 0.85rem; }
    .rs-pill { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 999px;
      font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }
    .rs-pill.complete { background: rgba(22,163,74,0.14); color: var(--accent); }
    .rs-pill.in_progress { background: rgba(245,158,11,0.16); color: #b45309; }
    .rs-pill.abandoned { background: rgba(100,116,139,0.16); color: #475569; }
    .rs-del { background: none; border: none; color: var(--bad); font-size: 0.8rem;
      font-weight: 700; cursor: pointer; text-decoration: underline; }

    /* ---- Status ---- */
    #status {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom) + 0.8rem);
      left: 0; right: 0;
      text-align: center;
      font-size: 0.85rem;
      color: #888;
      padding: 0 1rem;
    }
    #status.error { color: #f66; }
  </style>
</head>
<body>
  <!-- Home hub (rendered by hub.js) -->
  <div id="home"></div>
  <!-- Daily game (rendered by hub.js) -->
  <div id="daily"></div>

  <div id="mode-toggle">
    <button class="mode-btn home-btn" data-home              type="button">‹ Home</button>
    <button class="mode-btn active" data-mode="passive"   type="button">🎤 Passive</button>
    <button class="mode-btn"        data-mode="quiz"      type="button">🎯 Quiz</button>
    <button class="mode-btn"        data-mode="intervals" type="button">🎼 Intervals</button>
    <button class="mode-btn"        data-mode="learn"     type="button">📚 Learn</button>
    <button class="mode-btn"        data-mode="practice"  type="button">🗓️ Practice</button>
    <button class="mode-btn"        data-mode="tune"      type="button">🎶 Tunes</button>
    <button class="mode-btn"        data-mode="apgames"   type="button">🧠 AP Games</button>
    <button class="mode-btn"        data-mode="microtone" type="button">🔬 Microtone</button>
    <button class="mode-btn"        data-mode="battery"   type="button">🧪 Testing Battery</button>
    <button class="mode-btn"        data-mode="stats"     type="button">📊 Stats</button>
  </div>

  <div id="note" class="idle">—</div>
  <div id="debug">freq: — Hz &nbsp; clarity: — &nbsp; rms: —</div>

  <!-- Passive mode -->
  <button id="start" type="button">Start</button>

  <!-- Quiz mode -->
  <div id="quiz">
    <div id="quiz-submodes">
      <button class="submode-btn active" data-submode="sample" type="button">Sample</button>
      <button class="submode-btn"        data-submode="pitch"  type="button">Pitch</button>
      <button class="submode-btn"        data-submode="amount" type="button">Amount</button>
    </div>

    <div id="quiz-score">0 / 0</div>
    <div id="quiz-result"></div>

    <div id="ans-sample" class="answer-group active">
      <button class="answer-btn" id="btn-sample-intune" type="button">In tune ✓</button>
      <button class="answer-btn" id="btn-sample-off"    type="button">Off-pitch ✗</button>
    </div>

    <div id="ans-pitch" class="answer-group">
      <button class="answer-btn" id="btn-pitch-match"   type="button">Matches label ✓</button>
      <button class="answer-btn" id="btn-pitch-nomatch" type="button">Doesn't match ✗</button>
    </div>

    <div id="ans-amount" class="answer-group">
      <button class="answer-btn amount-btn" data-cents="-100" type="button">½↓</button>
      <button class="answer-btn amount-btn" data-cents="-50"  type="button">¼↓</button>
      <button class="answer-btn amount-btn" data-cents="0"    type="button">OG</button>
      <button class="answer-btn amount-btn" data-cents="50"   type="button">¼↑</button>
      <button class="answer-btn amount-btn" data-cents="100"  type="button">½↑</button>
    </div>

    <div id="followup">
      <div class="followup-label">What pitch did you hear?</div>
      <div id="followup-btns"></div>
      <button id="followup-skip" class="ghost" type="button">skip →</button>
    </div>

    <div id="quiz-actions">
      <button id="quiz-replay" class="ghost" type="button">play again ↺</button>
      <button id="quiz-next"   class="ghost" type="button">next →</button>
    </div>
  </div>

  <!-- Intervals mode -->
  <div id="intervals">
    <div id="intervals-controls">
      <label class="ctl-label">Interval
        <select id="interval-type">
          <option value="1">m2 — minor 2nd</option>
          <option value="2">M2 — major 2nd</option>
          <option value="3">m3 — minor 3rd</option>
          <option value="4" selected>M3 — major 3rd</option>
          <option value="5">P4 — perfect 4th</option>
          <option value="6">TT — tritone</option>
          <option value="7">P5 — perfect 5th</option>
          <option value="8">m6 — minor 6th</option>
          <option value="9">M6 — major 6th</option>
          <option value="10">m7 — minor 7th</option>
          <option value="11">M7 — major 7th</option>
          <option value="12">P8 — octave</option>
        </select>
      </label>
    </div>
    <div id="intervals-score">0 / 0</div>
    <div id="intervals-result">Which note is the root?</div>
    <div id="intervals-roots"></div>
    <div id="intervals-actions">
      <button id="intervals-hint"   class="ghost" type="button">hint ♪</button>
      <button id="intervals-replay" class="ghost" type="button">play again ↺</button>
      <button id="intervals-next"   class="ghost" type="button">next →</button>
    </div>
  </div>

  <!-- Learn mode (rendered by learn.js) -->
  <div id="learn"></div>

  <!-- Practice Routine (rendered by practice.js) -->
  <div id="practice"></div>

  <!-- Tune Learner (rendered by tune.js) -->
  <div id="tune"></div>

  <!-- Yes / No (standalone; now also a Learn phase) -->
  <div id="yesno"></div>

  <!-- Stats (rendered by stats.js) -->
  <div id="stats"></div>

  <!-- AP Mini Games (rendered by apgames.js) -->
  <div id="apgames"></div>

  <!-- Microtone (rendered by microtone.js) -->
  <div id="microtone"></div>

  <!-- Testing Battery (rendered by battery.js) -->
  <div id="battery"></div>

  <!-- Lucas-only Daily Calibration (rendered by calibrate.js) -->
  <div id="calibrate"></div>

  <!-- Working Memory standalone (rendered by wmsolo.js) -->
  <div id="wmsolo"></div>

  <div id="status">Tap Start to begin</div>

  <script type="module" src="./app.js"></script>
</body>
</html>
