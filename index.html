<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Pitches" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Pitches</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: #f4f8f5; color: #14241a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    html { overflow-y: auto; }
    body {
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: calc(env(safe-area-inset-top) + 4.5rem) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 3rem) env(safe-area-inset-left);
      user-select: none; -webkit-user-select: none;
    }

    /* ---- Mode toggle ---- */
    #mode-toggle {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 0.8rem);
      left: 0; right: 0;
      display: flex; gap: 0.5rem;
      z-index: 10;
      justify-content: flex-start;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 0 1rem;
      white-space: nowrap;
    }
    #mode-toggle::-webkit-scrollbar { display: none; }
    .mode-btn { flex: 0 0 auto; }
    .mode-btn, .submode-btn {
      padding: 0.45rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      border: 2px solid #444;
      border-radius: 999px;
      background: transparent;
      color: #888;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .mode-btn.active, .submode-btn.active {
      background: #eee; color: #111; border-color: #eee;
    }

    /* ---- Shared note display ---- */
    #note {
      font-size: 10rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      min-height: 1em;
      text-align: center;
      color: var(--text);
    }
    #note.idle { color: #c7d3ca; }
    body.quiz-mode #note { font-size: 6.5rem; }

    #debug {
      margin-top: 1.2rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
      color: #666;
      text-align: center;
      line-height: 1.5;
    }

    /* ---- Passive ---- */
    #start {
      margin-top: 2rem;
      padding: 1.25rem 2.5rem;
      font-size: 1.25rem;
      font-weight: 600;
      color: #111;
      background: #eee;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      touch-action: manipulation;
    }
    #start:disabled { opacity: 0.4; }
    #start.hidden { display: none; }

    /* ---- Quiz ---- */
    #quiz {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
      margin-top: 0.3rem;
      width: 100%;
      max-width: 460px;
      padding: 0 1rem;
    }
    #quiz.active { display: flex; }

    #quiz-submodes {
      display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: center;
    }

    #quiz-score {
      font-size: 0.95rem;
      color: #888;
      min-height: 1.3em;
    }
    #quiz-result {
      font-size: 0.95rem;
      font-weight: 600;
      min-height: 1.4em;
      text-align: center;
      line-height: 1.35;
      color: #ddd;
    }
    #quiz-result.correct { color: #4caf50; }
    #quiz-result.wrong   { color: #f44336; }

    .answer-group {
      display: none;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .answer-group.active { display: flex; }

    .answer-btn {
      padding: 0.85rem 1.3rem;
      font-size: 1rem;
      font-weight: 600;
      border: 2px solid #555;
      border-radius: 999px;
      background: transparent;
      color: #eee;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.1s, border-color 0.1s;
    }
    .answer-btn:active   { background: #333; }
    .answer-btn:disabled { opacity: 0.3; cursor: default; }
    .answer-btn.small    {
      padding: 0.55rem 0.55rem;
      font-size: 0.9rem;
      min-width: 0;
    }
    .amount-btn { min-width: 3.4rem; }

    /* ---- Follow-up (Pitch mode) ---- */
    #followup {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      padding-top: 0.6rem;
      border-top: 1px solid #2a2a2a;
    }
    #followup.active { display: flex; }
    .followup-label {
      color: #aaa;
      font-size: 0.9rem;
    }
    #followup-btns {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 0.35rem;
      width: 100%;
      max-width: 360px;
    }

    #quiz-actions { display: flex; gap: 1.4rem; margin-top: 0.2rem; }
    .ghost {
      font-size: 0.85rem;
      color: #888;
      background: none;
      border: none;
      cursor: pointer;
      touch-action: manipulation;
      text-decoration: underline;
      padding: 0.4rem;
    }
    #quiz-next { visibility: hidden; }
    #quiz-next.visible { visibility: visible; }

    /* ---- Intervals ---- */
    #intervals {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.3rem;
      width: 100%;
      max-width: 460px;
      padding: 0 1rem;
    }
    #intervals.active { display: flex; }
    #intervals-controls .ctl-label {
      display: flex; align-items: center; gap: 0.5rem;
      color: #aaa; font-size: 0.9rem;
    }
    #interval-type {
      background: #1a1a1a;
      color: #eee;
      border: 2px solid #555;
      border-radius: 999px;
      padding: 0.4rem 0.9rem;
      font-size: 0.9rem;
      font-family: inherit;
      touch-action: manipulation;
    }
    #intervals-score {
      font-size: 0.95rem; color: #888; min-height: 1.3em;
    }
    #intervals-result {
      font-size: 0.95rem; font-weight: 600;
      min-height: 1.4em; text-align: center; line-height: 1.35; color: #ddd;
    }
    #intervals-result.correct { color: #4caf50; }
    #intervals-result.wrong   { color: #f44336; }
    #intervals-roots {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 0.35rem;
      width: 100%;
      max-width: 360px;
    }
    #intervals-actions { display: flex; gap: 1.4rem; margin-top: 0.2rem; }
    #intervals-next { visibility: hidden; }
    #intervals-next.visible { visibility: visible; }

    /* =========================================================
       Learn + Practice — modern app styling
       ========================================================= */
    :root {
      --bg: #f4f8f5;
      --card: #ffffff;
      --card2: #eef4ef;
      --line: #dce7df;
      --text: #14241a;
      --muted: #6b8072;
      --accent: #16a34a;
      --accent2: #22c55e;
      --good: #16a34a;
      --bad: #ef4444;
      --shadow: 0 1px 2px rgba(20,40,26,0.05), 0 8px 24px rgba(20,40,26,0.06);
    }

    /* Full-width, top-aligned, scrollable app-style tabs. */
    body.mode-learn, body.mode-practice, body.mode-tune, body.mode-yesno, body.mode-stats, body.mode-apgames, body.mode-microtone, body.mode-battery, body.mode-wmsolo, body.mode-calibrate { background: var(--bg); }
    body.mode-learn, body.mode-practice, body.mode-tune, body.mode-yesno, body.mode-stats, body.mode-apgames, body.mode-microtone, body.mode-battery, body.mode-wmsolo, body.mode-calibrate {
      justify-content: flex-start;
    }
    body.mode-learn #note, body.mode-practice #note, body.mode-tune #note, body.mode-yesno #note, body.mode-stats #note, body.mode-apgames #note, body.mode-microtone #note, body.mode-battery #note, body.mode-wmsolo #note, body.mode-calibrate #note,
    body.mode-learn #debug, body.mode-practice #debug, body.mode-tune #debug, body.mode-yesno #debug, body.mode-stats #debug, body.mode-apgames #debug, body.mode-microtone #debug, body.mode-battery #debug, body.mode-wmsolo #debug, body.mode-calibrate #debug,
    body.mode-learn #start, body.mode-practice #start, body.mode-tune #start, body.mode-yesno #start, body.mode-stats #start, body.mode-apgames #start, body.mode-microtone #start, body.mode-battery #start, body.mode-wmsolo #start, body.mode-calibrate #start,
    body.mode-learn #status, body.mode-practice #status, body.mode-tune #status, body.mode-yesno #status, body.mode-stats #status, body.mode-apgames #status, body.mode-microtone #status, body.mode-battery #status, body.mode-wmsolo #status, body.mode-calibrate #status { display: none !important; }

    #learn, #practice, #tune, #yesno, #stats, #apgames, #microtone {
      display: none;
      width: 100%;
      max-width: 520px;
      padding: 0 1rem 2rem;
      animation: fadeIn 0.2s ease;
    }
    #learn.active, #practice.active, #tune.active, #yesno.active, #stats.active, #apgames.active, #microtone.active { display: block; }
    /* The battery runs on a desktop with a friend operating it — it gets more room. */
    #battery { display: none; width: 100%; max-width: 860px; padding: 0 1rem 3rem; animation: fadeIn 0.2s ease; }
    #battery.active { display: block; }
    #wmsolo { display: none; width: 100%; max-width: 860px; padding: 0 1rem 3rem; animation: fadeIn 0.2s ease; }
    #wmsolo.active { display: block; }

    /* ---- Daily Calibration (Lucas-only) ---- */
    #calibrate { display: none; width: 100%; max-width: 480px; padding: 0 1rem 3rem; animation: fadeIn 0.2s ease; }
    #calibrate.active { display: block; }
    body.mode-calibrate #mode-toggle { display: none !important; }   /* own ✕ button; no Lab nav */
    .cal-home, .cal-stage { text-align: center; position: relative; }
    .cal-home { padding-top: 3.2rem; }
    .cal-x { position: absolute; top: 0.9rem; left: 0; background: none; border: none; font-size: 1.4rem; color: var(--muted); cursor: pointer; padding: 0.3rem 0.5rem; }
    .cal-home .cal-x { top: 0.6rem; }
    .cal-badge { display: inline-block; font-size: 0.66rem; font-weight: 800; letter-spacing: 0.12em; color: #7c3aed; background: rgba(124,58,237,0.1); padding: 0.3rem 0.65rem; border-radius: 999px; }
    .cal-title2 { font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; margin: 0.6rem 0 0.4rem; }
    .cal-blurb { color: var(--muted); font-size: 0.96rem; line-height: 1.5; margin: 0 auto 1.1rem; max-width: 380px; }
    .cal-streakline { font-weight: 800; color: #e07b1a; margin-bottom: 1.3rem; }
    .cal-cta { display: inline-block; border: none; border-radius: 999px; background: linear-gradient(135deg,#7c3aed,#a855f7); color: #fff; font-weight: 800; font-size: 1rem; padding: 0.95rem 1.8rem; cursor: pointer; box-shadow: 0 8px 22px rgba(124,58,237,0.28); touch-action: manipulation; margin-top: 0.8rem; font-family: inherit; }
    .cal-cta.big { width: 100%; max-width: 340px; font-size: 1.08rem; }
    .cal-cta.ghost-cta { background: var(--card2); color: var(--text); box-shadow: none; border: 1px solid var(--line); font-size: 0.9rem; padding: 0.65rem 1.2rem; }
    .cal-foot { color: var(--muted); font-size: 0.75rem; line-height: 1.45; margin: 1.6rem auto 0; max-width: 330px; }
    .cal-top { display: flex; align-items: center; gap: 0.8rem; padding: 0.9rem 0 0.4rem; }
    .cal-top .cal-x { position: static; padding: 0.2rem 0.3rem; }
    .cal-prog { flex: 1; height: 8px; border-radius: 999px; background: var(--card2); overflow: hidden; margin: 0 auto; }
    .cal-prog-bar { height: 100%; background: linear-gradient(90deg,#7c3aed,#a855f7); border-radius: 999px; transition: width 0.4s ease; }
    .cal-step { font-size: 0.78rem; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
    .cal-kicker { text-align: center; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7c3aed; margin: 0.8rem 0 0.4rem; }
    .cal-stage { padding-top: 0.6rem; }
    .cal-big { font-size: 5.2rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1.05; margin: 0.6rem 0; color: var(--text); }
    .cal-big.ok-glow { color: #7c3aed; }
    .cal-big.pulse { animation: calPulse 1.6s ease-out; }
    @keyframes calPulse { 0% { transform: scale(1); text-shadow: 0 0 0 rgba(124,58,237,0); } 25% { transform: scale(1.08); text-shadow: 0 0 28px rgba(124,58,237,0.45); } 100% { transform: scale(1); text-shadow: 0 0 0 rgba(124,58,237,0); } }
    .cal-say { font-size: 1.08rem; font-weight: 600; line-height: 1.45; margin: 0.4rem auto; max-width: 360px; }
    .cal-hint { color: var(--muted); font-size: 0.86rem; margin-top: 0.3rem; }
    .cal-trialcount { font-size: 0.78rem; font-weight: 800; color: var(--muted); margin-bottom: 0.2rem; }
    .cal-count { font-size: 3rem; font-weight: 800; color: #a855f7; font-variant-numeric: tabular-nums; margin: 0.4rem 0; }
    .cal-phase { font-size: 1.1rem; font-weight: 800; color: var(--muted); margin: 1rem 0; min-height: 1.4em; }
    .cal-choices { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; margin: 1rem auto 0.4rem; max-width: 380px; }
    .cal-choices.col { flex-direction: column; max-width: 260px; }
    .cal-choice { flex: 1; min-width: 120px; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 14px; padding: 0.9rem 1rem; font-weight: 800; font-size: 1rem; cursor: pointer; box-shadow: var(--shadow); touch-action: manipulation; font-family: inherit; }
    .cal-choice.ok, .cal-key.ok { background: var(--good); border-color: var(--good); color: #fff; }
    .cal-choice.bad, .cal-key.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
    .cal-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.45rem; max-width: 340px; margin: 0.4rem auto; }
    .cal-key { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 12px; padding: 0.8rem 0; font-weight: 800; font-size: 1.02rem; cursor: pointer; touch-action: manipulation; font-family: inherit; }
    .cal-fb { min-height: 1.5em; font-weight: 800; margin-top: 0.8rem; font-size: 1.02rem; }
    .cal-fb.ok { color: var(--good); } .cal-fb.bad { color: var(--bad); }
    .cal-trans { padding-top: 4.5rem; }
    .cal-dots { display: flex; gap: 0.9rem; justify-content: center; margin: 1.1rem 0 0.4rem; }
    .cal-dot { width: 3rem; height: 3rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.1rem; background: var(--card2); color: var(--muted); border: 1px solid var(--line); transition: transform 0.15s, background 0.15s; }
    .cal-dot.on { background: linear-gradient(135deg,#7c3aed,#a855f7); color: #fff; border-color: transparent; transform: scale(1.12); }
    .cal-finish { padding-top: 3rem; }
    .cal-stats { display: flex; gap: 0.8rem; justify-content: center; margin: 1.3rem 0 0.6rem; }
    .cal-stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 0.8rem 1.2rem; min-width: 110px; box-shadow: var(--shadow); }
    .cal-stat-n { font-size: 1.5rem; font-weight: 800; }
    .cal-stat-l { font-size: 0.72rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
    /* check-in */
    .cal-checkin .cal-say { font-size: 0.95rem; color: var(--muted); font-weight: 600; }
    .cal-ci-row { margin: 1.1rem auto 0; max-width: 380px; text-align: left; }
    .cal-ci-l { font-size: 0.78rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.4rem; }
    .cal-ci-opts { display: flex; gap: 0.45rem; }
    .cal-ci { flex: 1; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 12px; padding: 0.7rem 0.4rem; font-weight: 700; font-size: 0.9rem; cursor: pointer; font-family: inherit; touch-action: manipulation; }
    .cal-ci.sel { background: rgba(124,58,237,0.12); border-color: #7c3aed; color: #6d28d9; }
    .cal-checkin .cal-cta.big { margin-top: 1.6rem; }
    /* mic meter */
    .cal-meter { width: 220px; height: 10px; border-radius: 999px; background: var(--card2); margin: 1.2rem auto; overflow: hidden; }
    .cal-meter-bar { height: 100%; width: 0; background: linear-gradient(90deg,#7c3aed,#a855f7); transition: width 0.06s linear; }
    .cal-toggle { display: flex; gap: 0.5rem; align-items: center; justify-content: center; font-size: 0.85rem; color: var(--muted); font-weight: 600; margin: 1rem auto 0.2rem; max-width: 340px; cursor: pointer; }
    .cal-home .ghost-cta { margin-top: 0.6rem; }
    /* level changes on finish */
    .cal-moves { margin: 0.4rem auto 0.6rem; max-width: 320px; }
    .cal-move { font-weight: 800; font-size: 0.92rem; padding: 0.3rem 0; }
    .cal-move.up { color: var(--good); } .cal-move.down { color: #e07b1a; }
    .cal-finish .cal-cta { display: block; margin: 0.7rem auto 0; min-width: 220px; }
    /* insights */
    .cal-ins { padding-bottom: 2rem; }
    .cal-ins-h { flex: 1; text-align: center; font-weight: 800; font-size: 1.15rem; }
    .cal-ins-sum { text-align: center; color: var(--muted); font-weight: 700; font-size: 0.85rem; margin-bottom: 0.4rem; }
    .cal-sec { font-size: 0.74rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #7c3aed; margin: 1.5rem 0 0.6rem; }
    .cal-sec span { color: var(--muted); letter-spacing: 0; text-transform: none; font-weight: 600; margin-left: 0.3rem; }
    .cal-ins-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 0.85rem 1rem; margin-bottom: 0.6rem; box-shadow: var(--shadow); }
    .cal-ins-t { font-size: 0.78rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .cal-ins-v { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; margin: 0.15rem 0; }
    .cal-ins-r { font-size: 0.9rem; line-height: 1.45; }
    .cal-ins-m { font-size: 0.75rem; color: var(--muted); margin-top: 0.35rem; line-height: 1.4; }
    .cal-trend { display: flex; align-items: flex-end; gap: 4px; height: 70px; padding: 0.4rem; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
    .cal-tbar { flex: 1; height: 100%; display: flex; align-items: flex-end; }
    .cal-tbar > div { width: 100%; background: linear-gradient(180deg,#a855f7,#7c3aed); border-radius: 4px 4px 0 0; min-height: 2px; }
    .cal-pcmap { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.35rem; }
    .cal-pc { border-radius: 10px; padding: 0.45rem 0; text-align: center; display: flex; flex-direction: column; gap: 0.1rem; }
    .cal-pc b { font-size: 0.95rem; } .cal-pc span { font-size: 0.68rem; font-weight: 700; opacity: 0.9; }
    .cal-chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .cal-chip { font-size: 0.78rem; font-weight: 800; background: rgba(124,58,237,0.1); color: #6d28d9; padding: 0.3rem 0.6rem; border-radius: 999px; }
    .cal-conf { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.9rem; }
    .cal-conf span { color: var(--muted); font-size: 0.78rem; margin-left: 0.3rem; }
    .cal-exp { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .cal-exp .cal-cta { margin-top: 0; }
    /* Training hub (Lucas only) */
    .cal-hub { position: relative; text-align: center; padding: 3.2rem 0 2rem; }
    .cal-hub .cal-x { top: 0.6rem; }
    .cal-hub .hub-cards { text-align: left; }
    .cal-hub-cal { display: block; width: 100%; text-align: left; border: none; border-radius: 24px; padding: 1.2rem 1.3rem; margin: 0.4rem 0 0.2rem;
      background: linear-gradient(135deg,#6d28d9,#a855f7); color: #fff; cursor: pointer; box-shadow: 0 10px 26px rgba(124,58,237,0.3); font-family: inherit; touch-action: manipulation; }
    .cal-hub-cal:active { transform: scale(0.985); }
    .chc-k { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.12em; opacity: 0.8; }
    .chc-t { font-size: 1.45rem; font-weight: 800; letter-spacing: -0.02em; margin: 0.25rem 0 0.2rem; }
    .chc-s { font-size: 0.9rem; opacity: 0.88; line-height: 1.35; }
    .chc-go { display: inline-block; margin-top: 0.8rem; font-weight: 800; background: rgba(255,255,255,0.2); padding: 0.45rem 0.9rem; border-radius: 999px; }
    .cal-coach { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 1rem 1.1rem; box-shadow: var(--shadow); }
    .cc-t { font-weight: 800; font-size: 1.15rem; }
    .cc-r { color: var(--muted); font-size: 0.92rem; line-height: 1.4; margin-top: 0.25rem; }
    .cal-coach .cal-cta { margin-top: 0.8rem; padding: 0.75rem 1.4rem; }
    .cc-alt { font-size: 0.85rem; color: var(--muted); margin-top: 0.6rem; }
    .cc-alt a { color: #6d28d9; font-weight: 700; cursor: pointer; text-decoration: underline; }
    .cal-coach-mini { font-size: 0.88rem; color: var(--muted); line-height: 1.4; margin: 1rem auto 0.3rem; max-width: 340px; }
    .cal-dcard { min-height: 112px; }
    /* drill chrome */
    .dr-top { display: flex; align-items: center; gap: 0.5rem; padding: 0.9rem 0 0.2rem; }
    .dr-top .cal-x { position: static; padding: 0.2rem 0.3rem; }
    .dr-title { flex: 1; text-align: center; font-weight: 800; font-size: 1.02rem; }
    .dr-lv { display: inline-block; font-size: 0.72rem; font-weight: 800; color: #6d28d9; background: rgba(124,58,237,0.12); padding: 0.15rem 0.5rem; border-radius: 999px; margin-left: 0.25rem; vertical-align: middle; }
    .dr-sw { background: var(--card2); border: 1px solid var(--line); border-radius: 12px; font-size: 1.1rem; padding: 0.3rem 0.65rem; cursor: pointer; color: var(--text); }
    .dr-stats { text-align: center; color: var(--muted); font-size: 0.8rem; font-weight: 700; margin-bottom: 0.4rem; font-variant-numeric: tabular-nums; }
    .dr-foot { display: flex; gap: 0.6rem; justify-content: center; margin: 1.6rem auto 0; max-width: 340px; }
    .dr-foot button { flex: 1; background: none; border: 1px dashed var(--line); border-radius: 12px; padding: 0.55rem; font-weight: 700; font-size: 0.85rem; color: var(--muted); cursor: pointer; font-family: inherit; touch-action: manipulation; }
    .cal-sync { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 0.85rem 1rem; margin-bottom: 0.7rem; font-size: 0.9rem; line-height: 1.45; box-shadow: var(--shadow); }
    .cal-sync .cs-s { color: var(--muted); font-size: 0.85rem; margin-top: 0.2rem; }
    .cal-sync .cal-cta { margin-top: 0.7rem; padding: 0.7rem 1.3rem; font-size: 0.92rem; }
    .cal-sync a { color: #6d28d9; font-weight: 700; cursor: pointer; text-decoration: underline; }
    .cal-sync code { font-size: 0.82rem; background: var(--card2); padding: 0.05rem 0.3rem; border-radius: 5px; }
    .cal-picker { padding-bottom: 2rem; }
    .cal-picker .hub-cards { margin-top: 0.8rem; }
    .cal-finish .cal-coach-mini { margin-top: 1.2rem; }
    .hub-lab-row { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
    .hub-lab-row .hub-lab { margin-left: 0; margin-right: 0; }

    /* ---- Working Memory standalone (reuses the .bt-* battery styles) ---- */
    .wm-explain { max-width: 46rem; margin: 0 auto 1.4rem; }
    .wm-explain p { font-size: 1.06rem; line-height: 1.7; margin: 0 0 0.9rem; }
    .wm-explain u { text-underline-offset: 3px; }
    .wm-eg { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; margin: 1.2rem 0 !important; }
    .wm-eg span { padding: 0.55rem 0.8rem; border-radius: 10px; background: var(--card2);
      border: 1px solid var(--line); font-weight: 700; font-size: 0.95rem; }
    .wm-eg .hit { background: var(--accent); color: #fff; border-color: var(--accent); }
    .wm-warn { background: #fff8e6; border: 1px solid #f0d493; color: #7a5a10;
      border-radius: 12px; padding: 0.8rem 1rem; font-size: 0.98rem !important; }
    .wm-demo-row, .wm-track { display: flex; gap: 0.35rem; flex-wrap: wrap;
      justify-content: center; margin: 1.2rem auto 0; max-width: 40rem; }
    .wm-slot { min-width: 3.6rem; padding: 0.45rem 0.5rem; border-radius: 9px; text-align: center;
      background: var(--card2); border: 1px solid var(--line); color: var(--muted);
      font-size: 0.8rem; font-weight: 700; }
    .wm-slot.on { color: var(--text); }
    .wm-slot.hit { background: var(--accent); color: #fff; border-color: var(--accent); }
    .wm-slot.bad { background: rgba(239,68,68,0.14); color: var(--bad); border-color: rgba(239,68,68,0.4); }
    .wm-head { margin-bottom: 1.6rem; }
    .wm-stage, .wm-ready { position: relative; display: flex; flex-direction: column;
      align-items: center; text-align: center; gap: 1rem; padding-top: 1.4rem; }
    .wm-load { font-size: 1.1rem; font-weight: 800; letter-spacing: 0.1em; color: var(--muted); }
    .wm-load.big { font-size: 2.6rem; letter-spacing: -0.01em; color: var(--text); }
    .wm-live { min-height: 1.6em; font-size: 1rem; font-weight: 600; color: var(--muted); }
    .wm-live.ok { color: var(--good); }
    .wm-live.bad { color: var(--bad); }
    .wm-tap { display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
      width: 100%; max-width: 22rem; padding: 2.2rem 1rem; border-radius: 20px;
      border: 3px solid var(--line); background: var(--card); color: var(--text);
      font-family: inherit; font-size: 1.6rem; font-weight: 800; letter-spacing: 0.02em;
      cursor: pointer; touch-action: manipulation; }
    .wm-tap:active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .wm-tap span { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.09em;
      color: var(--muted); text-transform: uppercase; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .screen-title { font-size: 1.9rem; font-weight: 800; margin: 0.2rem 0 0.3rem; letter-spacing: -0.02em; }
    .screen-sub   { color: var(--muted); font-size: 0.95rem; margin: 0 0 1.2rem; line-height: 1.4; }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 1rem 1.1rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow);
    }
    .panel-title { font-weight: 700; font-size: 1rem; margin-bottom: 0.7rem; display: flex; align-items: baseline; gap: 0.5rem; }
    .panel-sub { color: var(--muted); font-weight: 500; font-size: 0.8rem; }

    .primary-btn {
      width: 100%;
      padding: 1.05rem;
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      border: none;
      border-radius: 16px;
      cursor: pointer;
      touch-action: manipulation;
      margin: 0.4rem 0 1rem;
      box-shadow: 0 8px 22px rgba(22,163,74,0.28);
    }
    .primary-btn:disabled { opacity: 0.45; box-shadow: none; }
    .primary-btn:active:not(:disabled) { transform: translateY(1px); }

    .icon-btn {
      background: var(--card2); color: var(--text);
      border: 1px solid var(--line); border-radius: 12px;
      padding: 0.45rem 0.8rem; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; touch-action: manipulation;
    }

    /* ---- Learn home cards ---- */
    .learn-cards { display: flex; flex-direction: column; gap: 0.7rem; }
    .learn-card {
      display: flex; align-items: center; gap: 0.9rem; text-align: left;
      background: var(--card); border: 1px solid var(--line);
      border-radius: 18px; padding: 1rem; cursor: pointer; color: var(--text);
      touch-action: manipulation; width: 100%;
    }
    .learn-card:active:not(.locked) { background: var(--card2); }
    .learn-card.locked { opacity: 0.5; cursor: default; }
    .learn-card-icon { font-size: 1.7rem; width: 2.4rem; text-align: center; flex: 0 0 auto; }
    .learn-card-body { flex: 1; min-width: 0; }
    .learn-card-title { font-weight: 700; font-size: 1.1rem; }
    .learn-card-blurb { color: var(--muted); font-size: 0.85rem; line-height: 1.35; margin-top: 0.15rem; }
    .learn-card-sub { color: var(--accent); font-size: 0.78rem; font-weight: 600; margin-top: 0.4rem; }
    .learn-card-chev { font-size: 1.6rem; color: var(--muted); flex: 0 0 auto; }

    /* ---- Trainer shell (Learn) ---- */
    .trainer { display: flex; flex-direction: column; gap: 0.9rem; }
    .trainer-top { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .trainer-title { font-weight: 700; font-size: 1.05rem; }
    .trainer-score { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
    .trainer-progress { height: 8px; background: var(--card2); border-radius: 999px; overflow: hidden; }
    .trainer-progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg,#16a34a,#22c55e); transition: width 0.3s; }
    .trainer-prompt { text-align: center; font-size: 1.15rem; font-weight: 600; min-height: 2.6em; display: flex; align-items: center; justify-content: center; line-height: 1.35; }
    .trainer-prompt b { color: var(--accent); }
    .trainer-answers { display: flex; flex-direction: column; align-items: center; gap: 0.6rem; }
    .trainer-answers > .answer-btn, .trainer-answers > div { }
    #learn-answers { display: grid; grid-template-columns: repeat(auto-fit, minmax(64px, 1fr)); gap: 0.4rem; width: 100%; }
    #learn-answers .answer-btn { width: 100%; }
    .trainer-actions { display: flex; justify-content: center; gap: 1.4rem; margin-top: 0.3rem; }
    .autonext { display: flex; align-items: center; justify-content: center; gap: 0.45rem; margin-top: 0.5rem; color: var(--muted); font-size: 0.85rem; cursor: pointer; }
    .autonext input { width: 1.05rem; height: 1.05rem; accent-color: var(--accent); }
    .learn-opts { display: flex; gap: 1.4rem; justify-content: center; flex-wrap: wrap; }
    .learn-award { text-align: center; font-weight: 700; color: #f2c94c; min-height: 0; max-height: 0; overflow: hidden; opacity: 0; transition: all 0.3s; }
    .learn-award.show { min-height: 1.4em; max-height: 3em; opacity: 1; margin: 0.3rem 0; }
    .big-note { display: block; font-size: 5rem; font-weight: 800; line-height: 1.05; color: var(--text); }
    #learn-decomp-row { margin-top: -0.2rem; }
    .yn-config { margin-top: 1.2rem; padding-top: 0.9rem; border-top: 1px solid var(--line); width: 100%; }
    .yn-pick-label { color: var(--muted); font-size: 0.8rem; margin: 0.7rem 0 0.4rem; }
    .yn-pick { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0.35rem; }
    .yn-chip { padding: 0.45rem 0; border-radius: 8px; border: 2px solid var(--line); background: var(--card2); color: #667; font-weight: 700; font-size: 0.85rem; cursor: pointer; touch-action: manipulation; }
    .yn-chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    .note-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0.4rem; width: 100%; }
    .note-grid.wide { grid-template-columns: repeat(auto-fit, minmax(64px, 1fr)); gap: 0.5rem; }
    #learn-answers .note-grid .answer-btn { width: 100%; }
    .trainer-sess { text-align: center; color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; margin-top: 0.3rem; }
    .pattern-picker { text-align: center; margin-bottom: 0.7rem; }
    .pattern-picker label { color: var(--muted); font-size: 0.9rem; display: inline-flex; gap: 0.5rem; align-items: center; }
    .pattern-picker select { background: var(--card2); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 0.4rem 0.9rem; font-family: inherit; font-size: 0.95rem; }

    /* ---- Stats ---- */
    .stat-note-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
    .stat-note { background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 0.6rem 0.3rem; text-align: center; }
    .stat-note.started { border-color: #5b6; }
    .stat-note.mastered { border-color: #f2c94c; background: rgba(242,201,76,0.12); }
    .stat-note-name { font-weight: 700; font-size: 1rem; }
    .stat-note-pct { color: var(--accent); font-size: 0.9rem; font-weight: 700; }
    .stat-note-sub { color: var(--muted); font-size: 0.7rem; }
    .award { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
    .award:last-child { border-bottom: none; }
    .award span { color: var(--muted); font-size: 0.78rem; }

    .tag { font-size: 0.7rem; padding: 0.12rem 0.5rem; border-radius: 999px; background: rgba(22,163,74,0.14); color: var(--accent); font-weight: 700; vertical-align: middle; }
    .tag.clean { background: rgba(123,216,143,0.18); color: #9be4ac; }

    .voicing-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 0.6rem; width: 100%; grid-column: 1 / -1; }
    .voicing-btn {
      display: flex; flex-direction: column; align-items: center; gap: 0.25rem;
      padding: 1rem 0.6rem; border-radius: 16px; border: 2px solid var(--line);
      background: var(--card2); color: var(--text); cursor: pointer; touch-action: manipulation;
    }
    .voicing-btn:active { border-color: var(--accent); }
    .voicing-btn.study-hl { border-color: var(--good); box-shadow: 0 0 0 2px rgba(76,175,80,0.35); }
    .voicing-btn b { font-size: 1.15rem; }
    .voicing-btn span { color: var(--muted); font-size: 0.85rem; }
    .interval-picker { grid-column: 1 / -1; text-align: center; margin-top: 0.3rem; }
    .interval-picker label { color: var(--muted); font-size: 0.85rem; display: inline-flex; gap: 0.4rem; align-items: center; }
    .interval-picker select {
      background: var(--card2); color: var(--text); border: 1px solid var(--line);
      border-radius: 999px; padding: 0.35rem 0.7rem; font-family: inherit; font-size: 0.85rem;
    }

    /* Per-note mastery readout (Pitches phase) */
    .mastery-strip {
      grid-column: 1 / -1;
      display: grid; grid-template-columns: repeat(auto-fit, minmax(38px, 1fr));
      gap: 0.3rem; margin-top: 0.6rem;
    }
    .mastery-cell { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; font-size: 0.7rem; color: var(--muted); }
    .mastery-cell.mid  { color: #d9c26a; }
    .mastery-cell.done { color: var(--good); }
    .mastery-bar { width: 100%; height: 4px; background: var(--card2); border-radius: 999px; overflow: hidden; }
    .mastery-bar > div { height: 100%; background: currentColor; transition: width 0.3s; }

    /* ---- Practice: stats + factions ---- */
    .stat-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; margin-bottom: 1rem; }
    .stat-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 1.1rem; text-align: center; }
    .stat-big { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
    .stat-label { color: var(--muted); font-size: 0.82rem; margin-top: 0.15rem; }

    .faction-row { display: grid; grid-template-columns: 6.5rem 1fr 2.6rem; align-items: center; gap: 0.6rem; margin: 0.45rem 0; }
    .faction-label { font-size: 0.85rem; color: var(--text); }
    .faction-track { height: 10px; background: var(--card2); border-radius: 999px; overflow: hidden; }
    .faction-fill { height: 100%; width: 0%; border-radius: 999px; transition: width 0.4s; }
    .faction-val { text-align: right; color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
    .suggestion { margin-top: 0.8rem; padding: 0.7rem 0.8rem; background: rgba(167,139,250,0.12); border: 1px solid rgba(167,139,250,0.3); border-radius: 12px; font-size: 0.85rem; line-height: 1.4; }
    .suggestion b { color: #c4b5fd; }

    .hist-row { display: flex; justify-content: space-between; padding: 0.4rem 0; border-bottom: 1px solid var(--line); font-size: 0.88rem; color: var(--muted); }
    .hist-row:last-child { border-bottom: none; }
    .hist-empty { color: var(--muted); font-size: 0.88rem; }

    /* ---- Practice: setup ---- */
    .setup-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .chip-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .chip {
      padding: 0.5rem 1rem; border-radius: 999px; border: 2px solid var(--line);
      background: var(--card2); color: var(--muted); font-weight: 700; cursor: pointer; touch-action: manipulation;
    }
    .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .custom-time { display: flex; align-items: center; gap: 0.8rem; margin-top: 0.9rem; }
    .custom-time input[type=range] { flex: 1; accent-color: var(--accent); }
    #pr-range-val { color: var(--text); font-weight: 700; font-size: 0.9rem; min-width: 4.2rem; text-align: right; }

    .skill-list { display: flex; flex-direction: column; gap: 0.55rem; }
    .skill-row { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--card2); }
    .skill-row.on { border-color: var(--accent); }
    .skill-toggle { display: flex; align-items: center; gap: 0.7rem; width: 100%; padding: 0.8rem; background: none; border: none; color: var(--text); cursor: pointer; text-align: left; touch-action: manipulation; }
    .skill-check { width: 1.4rem; height: 1.4rem; border-radius: 7px; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; color: #fff; flex: 0 0 auto; }
    .skill-row.on .skill-check { background: var(--accent); border-color: var(--accent); }
    .skill-icon { font-size: 1.2rem; }
    .skill-name { font-weight: 600; display: flex; flex-direction: column; }
    .skill-faction { font-size: 0.72rem; color: var(--muted); font-weight: 500; }
    .skill-mode { display: flex; gap: 0.4rem; padding: 0 0.8rem 0.8rem; }
    .skill-mode.hidden { display: none; }
    .seg { flex: 1; padding: 0.5rem; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--muted); font-size: 0.8rem; font-weight: 600; cursor: pointer; touch-action: manipulation; }
    .seg.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .plan-list { display: flex; flex-direction: column; gap: 0.35rem; }
    .plan-seg { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 0.4rem 0.6rem; background: var(--card2); border-radius: 10px; }
    .plan-seg.brk { color: var(--muted); background: transparent; font-size: 0.8rem; }

    /* ---- Practice: runner ---- */
    .runner { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 0.5rem; }
    .runner-sub { color: var(--muted); font-size: 0.85rem; margin-top: 0.3rem; }
    .runner-title { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.01em; }
    .runner-clock { font-size: 4.2rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; color: var(--accent); line-height: 1.1; }
    .runner[style*="--accent"] .runner-clock { color: var(--accent); }
    .runner-ring { width: 100%; max-width: 320px; height: 8px; background: var(--card2); border-radius: 999px; overflow: hidden; }
    .runner-ring-bar { height: 100%; width: 0%; background: var(--accent); transition: width 1s linear; }
    .runner-body { margin: 1rem 0 0.5rem; width: 100%; max-width: 380px; }
    .guide-note { color: var(--muted); font-size: 0.95rem; line-height: 1.5; }
    .guide-content { margin-top: 0.8rem; }
    .read-line { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 1rem; font-size: 1rem; line-height: 1.6; }
    .read-line.big { font-size: 1.4rem; font-weight: 700; }
    .read-line .notes { font-family: ui-monospace, Menlo, monospace; font-size: 1.3rem; letter-spacing: 0.1em; color: var(--text); }
    .runner-controls { display: flex; gap: 1.6rem; margin-top: 0.8rem; }
    .runner-controls .ghost { font-size: 1rem; color: var(--text); }
    .runner-next { color: var(--muted); font-size: 0.85rem; margin-top: 0.6rem; }

    /* ---- Practice: summary ---- */
    .summary { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .summary-emoji { font-size: 3.5rem; margin: 1rem 0 0.3rem; }
    .summary .panel, .summary .stat-cards { width: 100%; }

    /* ---- Tune Learner ---- */
    .tune-session { display: flex; flex-direction: column; }
    .line-toggle { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .line-toggle .seg { flex: 1; padding: 0.6rem; }
    .tune-bar-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 20px;
      padding: 1.4rem 1rem; text-align: center; margin-bottom: 1rem;
    }
    .tune-bar-num { color: var(--muted); font-size: 0.85rem; }
    .tune-chord { font-size: 2.6rem; font-weight: 800; letter-spacing: -0.02em; margin: 0.3rem 0; }
    .tune-notes {
      font-family: ui-monospace, Menlo, monospace; font-size: 1.1rem;
      color: var(--accent); letter-spacing: 0.04em; min-height: 1.4em;
    }
    .tune-loop { color: var(--muted); font-size: 0.85rem; margin-top: 0.7rem; }
    .tune-tempo { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1rem; color: var(--muted); font-size: 0.85rem; }
    .tune-tempo input[type=range] { flex: 1; accent-color: var(--accent); }
    .tune-tempo #tune-bpm-val { min-width: 5rem; text-align: right; color: var(--text); font-weight: 700; }
    .tune-actions { display: flex; justify-content: center; gap: 1.2rem; margin-top: 0.4rem; flex-wrap: wrap; }
    /* iReal-style chart */
    .chart { margin-bottom: 0.8rem; }
    .chart-sec { margin-bottom: 0.7rem; }
    .chart-label { color: var(--accent); font-weight: 800; font-size: 0.85rem; margin-bottom: 0.25rem; }
    .chart-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.3rem; }
    .chart-cell {
      border: 1px solid var(--line); border-radius: 8px; background: var(--card);
      min-height: 3rem; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.95rem; text-align: center; padding: 0.3rem; cursor: pointer;
      touch-action: manipulation; line-height: 1.15;
    }
    .chart-cell.cur { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(22,163,74,0.35); }
    .chart-cell { flex-direction: column; gap: 0.15rem; }
    .cc-ch { font-weight: 700; }
    .cc-mel { font-size: 0.62rem; font-weight: 500; opacity: 0.72; font-family: ui-monospace, Menlo, monospace; letter-spacing: 0.02em; line-height: 1.1; }
    .tune-hud { text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 0.8rem; }
    .tune-controls { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.8rem; flex-wrap: wrap; }
    .tune-controls .mini { display: flex; align-items: center; gap: 0.4rem; color: var(--muted); font-size: 0.85rem; }
    .tune-controls select { background: var(--card2); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 0.35rem 0.7rem; font-family: inherit; font-size: 0.85rem; }
    .tune-controls .line-toggle { margin: 0; flex: 1; min-width: 160px; }
    .tune-checks { display: flex; gap: 1.4rem; margin-bottom: 1rem; color: var(--text); font-size: 0.9rem; }
    .tune-checks label { display: flex; align-items: center; gap: 0.4rem; }
    .tune-checks input { width: 1.05rem; height: 1.05rem; accent-color: var(--accent); }
    .sing-target { display: flex; flex-wrap: wrap; gap: 0.35rem; justify-content: center; margin-bottom: 1rem; }
    .sng { padding: 0.3rem 0.55rem; border-radius: 8px; background: var(--card2); color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 0.9rem; }
    .sng.hit { background: var(--good); color: #072; font-weight: 700; }

    /* ---- Yes / No ---- */
    .yn { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .yn .trainer-score { margin: 0.2rem 0 0.6rem; }
    .yn-note { font-size: 7rem; font-weight: 800; line-height: 1; letter-spacing: -0.04em; color: var(--text); }
    .yn-sub { color: var(--muted); font-size: 0.95rem; margin: 0.8rem 0 1.2rem; }
    .yn-answers { display: flex; gap: 1rem; }
    .yn-answers .answer-btn { min-width: 6rem; }
    .yn-result { min-height: 1.5em; margin-top: 1.1rem; font-size: 0.95rem; font-weight: 600; color: #ddd; }
    .yn-result.correct { color: var(--good); }
    .yn-result.wrong { color: var(--bad); }
    .yn-result b { color: var(--accent); }

    /* ---- AP Mini Games ---- */
    .apg { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .apg-score { color: var(--muted); font-size: 0.95rem; font-variant-numeric: tabular-nums; margin: 0.2rem 0 0.4rem; }
    .apg-sub { color: var(--muted); font-size: 0.95rem; margin: 0.5rem 0 0.9rem; min-height: 1.3em; }
    .apg-sub.ok { color: var(--good); font-weight: 700; }
    .apg-sub.wrong { color: var(--bad); }
    .apg-result { min-height: 1.5em; margin: 0.8rem 0; font-size: 0.9rem; font-weight: 600; font-family: ui-monospace, Menlo, monospace; color: #ddd; }
    .apg-result.ok { color: var(--good); }
    .apg-result.wrong { color: var(--bad); }
    .apg-opts { display: flex; gap: 1.3rem; align-items: center; justify-content: center; margin-top: 1rem; flex-wrap: wrap; color: var(--muted); font-size: 0.85rem; }
    .apg-opts .mini { display: flex; align-items: center; gap: 0.4rem; }
    .apg-opts select { background: var(--card2); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 0.3rem 0.7rem; font-family: inherit; font-size: 0.85rem; }
    .apg .note-grid { max-width: 380px; }
    .apg-live { font-family: ui-monospace, Menlo, monospace; font-size: 1.1rem; color: var(--accent); min-height: 1.4em; }
    /* Cents needle */
    .needle { position: relative; width: 100%; max-width: 320px; height: 30px; background: var(--card2); border: 1px solid var(--line); border-radius: 8px; margin: 0.6rem 0; overflow: hidden; }
    .needle-zone { position: absolute; top: 0; bottom: 0; background: rgba(76,175,80,0.22); }
    .needle-center { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--muted); transform: translateX(-1px); }
    .needle-mark { position: absolute; top: 3px; bottom: 3px; width: 4px; border-radius: 2px; background: var(--accent); transform: translateX(-2px); transition: left 0.06s linear, background 0.1s; opacity: 0; }

    /* ---- Microtone keyboard (two-tier piano, fixed C..B, no scroll) ---- */
    .micro-kbd { position: relative; width: 100%; height: 140px; margin: 0.9rem 0; }
    .mkbd-et { display: flex; gap: 2px; height: 100%; }
    .mkey { cursor: pointer; touch-action: manipulation; border: 1px solid #2a2a2a; font-size: 0.62rem; }
    .mkey.et { flex: 1; height: 100%; background: #edf0f7; color: #333; font-weight: 700;
      border-radius: 0 0 5px 5px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5px; }
    .mkey.et:active { background: #d7dcea; }
    .mkey.qt { position: absolute; top: 0; width: 22px; height: 58%; background: #15171d; border-radius: 0 0 4px 4px; z-index: 2; }
    .mkey.qt:active { background: #262a34; }
    .mkey.ref { background: var(--accent) !important; color: #fff !important; border-color: var(--accent) !important; }
    .mkey.correct { background: var(--good) !important; color: #063 !important; border-color: var(--good) !important; }
    .mkey.wrong { background: var(--bad) !important; color: #fff !important; border-color: var(--bad) !important; }

    /* =========================================================
       Home hub + daily games (NYT-mini style overlays)
       ========================================================= */
    #home, #daily {
      position: fixed; inset: 0; z-index: 60; display: none;
      overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg);
      padding: calc(env(safe-area-inset-top) + 1.2rem) 1rem calc(env(safe-area-inset-bottom) + 2rem);
    }
    body.view-home #home { display: block; }
    body.view-daily #daily { display: block; }

    .hub { max-width: 480px; margin: 0 auto; }
    .hub-head { text-align: center; margin: 1.4rem 0 1.8rem; }
    .hub-date { color: var(--muted); font-size: 0.9rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
    .hub-title { font-size: 2.4rem; font-weight: 800; letter-spacing: -0.03em; margin: 0.2rem 0 0; }
    .hub-hello { color: var(--muted); font-size: 0.98rem; font-weight: 600; margin-top: 0.4rem; }
    .hub-section-label { color: var(--muted); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0.2rem 0.7rem; }
    .hub-cards { display: flex; flex-direction: column; gap: 0.9rem; }
    .hub-card {
      position: relative; display: flex; flex-direction: column; justify-content: space-between;
      min-height: 128px; width: 100%; text-align: left;
      border: none; border-radius: 24px; padding: 1.25rem 1.35rem;
      color: #14241a; cursor: pointer; touch-action: manipulation;
      box-shadow: 0 6px 18px rgba(20,40,26,0.08); transition: transform 0.12s; overflow: hidden;
    }
    .hub-card:active:not(.locked) { transform: scale(0.98); }
    .hub-card.locked { opacity: 0.5; cursor: default; }
    .hub-emoji { position: absolute; top: 1.15rem; right: 1.2rem; font-size: 2.5rem; line-height: 1; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.12)); }
    .hub-card-top { padding-right: 3.4rem; }
    .hub-card-title { font-weight: 800; font-size: 1.45rem; letter-spacing: -0.02em; line-height: 1.08; }
    .hub-card-sub { color: rgba(20,40,26,0.6); font-size: 0.92rem; margin-top: 0.3rem; line-height: 1.3; }
    .hub-card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 1.1rem; }
    .hub-foot-tag { font-weight: 800; font-size: 0.92rem; }
    .hub-foot-tag.done { color: #15803d; }
    .hub-foot-note { font-size: 0.68rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(20,40,26,0.42); }
    .hub-lab {
      display: block; margin: 1.6rem auto 0.4rem; padding: 0.4rem 0.9rem;
      background: none; border: none; color: var(--muted);
      font-weight: 600; font-size: 0.82rem; text-decoration: underline; cursor: pointer; touch-action: manipulation;
    }
    .hub-foot { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 1.2rem; line-height: 1.5; }
    .home-btn { color: var(--accent) !important; border-color: transparent !important; }
    /* Solo-lab: a Home card opened one Lab game — hide the rest of the Lab nav. */
    body.solo-lab #mode-toggle .mode-btn:not(.home-btn) { display: none; }
    .hub-user { position: absolute; top: calc(env(safe-area-inset-top) + 1rem); right: 1rem; display: flex; align-items: center; gap: 0.4rem; background: var(--card2); border: 1px solid var(--line); border-radius: 999px; padding: 0.3rem 0.7rem; color: var(--text); font-size: 0.85rem; font-weight: 600; cursor: pointer; z-index: 2; }
    .hub-user img { width: 1.5rem; height: 1.5rem; border-radius: 50%; object-fit: cover; }

    /* Profile modal */
    .modal { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .modal-card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 1.4rem; width: 100%; max-width: 340px; text-align: center; }
    .modal-title { font-weight: 800; font-size: 1.2rem; margin-bottom: 1rem; }
    .modal-avatar { display: inline-flex; align-items: center; justify-content: center; width: 5rem; height: 5rem; border-radius: 50%; background: var(--card2); border: 2px dashed var(--line); color: var(--muted); font-size: 0.8rem; cursor: pointer; overflow: hidden; margin-bottom: 1rem; }
    .modal-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .modal-input { width: 100%; padding: 0.8rem 1rem; border-radius: 12px; border: 1px solid var(--line); background: var(--card2); color: var(--text); font-size: 1rem; font-family: inherit; text-align: center; }
    .modal-err { color: var(--muted); font-size: 0.85rem; min-height: 1.3em; margin: 0.6rem 0; }
    .modal-actions { display: flex; justify-content: center; gap: 1.2rem; margin-top: 0.8rem; }
    .welcome-p { color: var(--muted); font-size: 0.95rem; line-height: 1.5; margin: 0 0 1rem; }
    .welcome-tip { background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 0.8rem; font-size: 0.9rem; line-height: 1.5; color: var(--text); margin-bottom: 1rem; }
    .welcome-tip b { color: var(--accent); }

    /* Leaderboard */
    .lb { width: 100%; max-width: 380px; margin: 1rem auto; }
    .lb-row { display: flex; align-items: center; gap: 0.7rem; padding: 0.6rem 0.5rem; border-bottom: 1px solid var(--line); }
    .lb-row.me { background: rgba(22,163,74,0.12); border-radius: 10px; }
    .lb-rank { width: 1.5rem; text-align: center; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
    .lb-pic { width: 2rem; height: 2rem; border-radius: 50%; object-fit: cover; flex: 0 0 auto; }
    .lb-pic.ph { background: var(--card2); }
    .lb-name { flex: 1; text-align: left; font-weight: 600; }
    .lb-score { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
    .lb-empty { color: var(--muted); text-align: center; padding: 1.5rem; }
    .lb-streak { color: #e07b1a; font-weight: 800; font-size: 0.8rem; white-space: nowrap; }
    .lb-row.nop { opacity: 0.5; }
    .lb-row.nop .lb-score { color: var(--muted); font-weight: 600; }
    .done-board { width: 100%; max-width: 340px; margin: 1.3rem auto 0; }
    .done-board-title { font-weight: 800; font-size: 0.95rem; margin-bottom: 0.2rem; text-align: center; }
    .done-board .lb { margin: 0.4rem auto; }

    /* Social: feed + DMs */
    .soc { max-width: 440px; margin: 0 auto; }
    .soc-title-row { display: flex; align-items: center; justify-content: space-between; margin: 1rem 0 0.9rem; }
    .soc-title-row .dg-x { font-size: 1.6rem; }
    .soc-title { font-weight: 900; font-size: 1.5rem; letter-spacing: -0.02em; }
    .soc-seg { display: flex; gap: 0.4rem; background: var(--card2); border-radius: 999px; padding: 0.25rem; margin-bottom: 1rem; }
    .soc-seg button { flex: 1; padding: 0.55rem; border-radius: 999px; border: none; background: none; color: var(--muted); font-weight: 800; font-size: 0.9rem; cursor: pointer; touch-action: manipulation; }
    .soc-seg button.on { background: var(--card); color: var(--accent); box-shadow: var(--shadow); }
    .soc-new { background: var(--text); color: var(--bg); border: none; width: 2rem; height: 2rem; border-radius: 50%; font-size: 1.2rem; font-weight: 700; cursor: pointer; }
    .soc-compose { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .soc-compose input { flex: 1; padding: 0.7rem 0.9rem; border-radius: 12px; border: 1px solid var(--line); background: var(--card2); color: var(--text); font-family: inherit; font-size: 0.95rem; }
    .soc-compose button { padding: 0 1.1rem; border-radius: 12px; border: none; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; }
    .soc-list { display: flex; flex-direction: column; gap: 0.7rem; }
    .feed-item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 0.9rem; }
    .feed-head { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; }
    .feed-name { font-weight: 700; }
    .feed-ago { color: var(--muted); font-size: 0.8rem; margin-left: auto; }
    .feed-body { font-size: 0.95rem; line-height: 1.4; }
    .feed-cmt { margin-top: 0.5rem; background: none; border: none; color: var(--muted); font-size: 0.8rem; cursor: pointer; padding: 0; }
    .feed-comments { margin-top: 0.6rem; padding-top: 0.6rem; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 0.4rem; }
    .cmt { font-size: 0.88rem; line-height: 1.35; }
    .cmt b { color: var(--accent); }
    .cmt-add { display: flex; gap: 0.4rem; margin-top: 0.3rem; }
    .cmt-add input { flex: 1; padding: 0.5rem 0.7rem; border-radius: 10px; border: 1px solid var(--line); background: var(--card2); color: var(--text); font-size: 0.85rem; }
    .cmt-add button { padding: 0 0.8rem; border-radius: 10px; border: none; background: var(--card2); color: var(--text); font-weight: 700; cursor: pointer; }
    .dm-thread { display: flex; align-items: center; gap: 0.6rem; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 0.7rem 0.9rem; color: var(--text); cursor: pointer; }
    .dm-last { color: var(--muted); font-size: 0.85rem; margin-left: auto; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dm-msgs { display: flex; flex-direction: column; gap: 0.4rem; height: 60vh; overflow-y: auto; padding: 0.5rem 0; }
    .bubble { max-width: 78%; padding: 0.55rem 0.8rem; border-radius: 14px; background: var(--card2); align-self: flex-start; font-size: 0.92rem; line-height: 1.35; }
    .bubble.mine { align-self: flex-end; background: var(--accent); color: #fff; }
    .hub-nav { display: flex; gap: 0.6rem; margin: 1rem 0 0; }
    .hub-nav button { flex: 1; padding: 0.7rem; border-radius: 14px; border: 1px solid var(--line); background: var(--card2); color: var(--text); font-weight: 700; cursor: pointer; font-size: 0.85rem; }
    .board-tabs { display: flex; gap: 0.4rem; overflow-x: auto; margin-bottom: 0.8rem; scrollbar-width: none; }
    .board-tabs::-webkit-scrollbar { display: none; }
    .board-tab { flex: 0 0 auto; padding: 0.5rem 0.9rem; border-radius: 999px; border: 1px solid var(--line); background: var(--card2); color: var(--muted); font-weight: 700; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }
    .board-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .board-sub { color: var(--muted); font-size: 0.85rem; text-align: center; margin-bottom: 0.5rem; }
    .board-cmts { max-width: 380px; margin: 0 auto 1rem; }
    .bc-list { display: flex; flex-direction: column; gap: 0.45rem; margin-bottom: 0.6rem; }
    .bc-list .cmt { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 0.55rem 0.75rem; }
    .bc-date { text-align: center; color: var(--muted); font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; margin: 0.7rem 0 0.35rem; position: relative; }
    .bc-date::before, .bc-date::after { content: ""; position: absolute; top: 50%; width: 26%; height: 1px; background: var(--line); }
    .bc-date::before { left: 0; } .bc-date::after { right: 0; }
    .prof-scores { margin: 0.6rem 0; text-align: left; }
    .prof-scores .hist-row { padding: 0.35rem 0; }

    /* Daily game */
    .dg { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .dg-x { align-self: flex-start; background: none; border: none; color: var(--muted); font-size: 1.4rem; cursor: pointer; padding: 0.2rem 0.5rem; }
    .dg-name { font-weight: 700; color: var(--muted); font-size: 0.95rem; margin-top: 0.5rem; }
    .dg-lives { font-size: 1.4rem; margin: 0.5rem 0; letter-spacing: 0.15em; }
    .dg-gap { font-size: 2.4rem; font-weight: 800; margin: 0.6rem 0; letter-spacing: -0.02em; }
    .dg-gap span { display: block; font-size: 0.9rem; font-weight: 500; color: var(--muted); letter-spacing: 0; }
    .dg-q { color: var(--muted); font-size: 0.95rem; margin: 0.8rem 0 1.4rem; line-height: 1.4; }
    .dg-ans { display: flex; gap: 1rem; width: 100%; max-width: 340px; }
    .dg-btn { flex: 1; padding: 1.1rem; font-size: 1.1rem; font-weight: 700; border-radius: 16px; border: 2px solid var(--line); background: var(--card2); color: var(--text); cursor: pointer; touch-action: manipulation; }
    .dg-btn:active { border-color: var(--accent); }
    .dg-replay { margin-top: 1.1rem; background: none; border: none; color: var(--muted); text-decoration: underline; font-size: 0.9rem; cursor: pointer; }
    .dg-best { color: var(--muted); font-size: 0.85rem; margin-top: 1rem; line-height: 1.4; }
    .dg-result { justify-content: center; padding-top: 2rem; }
    .dg-emoji { font-size: 3.5rem; margin: 1rem 0 0.5rem; }
    .dg-score { font-size: 3rem; font-weight: 800; color: var(--accent); letter-spacing: -0.02em; }
    .dg-score-sub { color: var(--muted); font-size: 0.95rem; margin-top: 0.3rem; }
    .dg-cta { margin-top: 1.6rem; padding: 1rem 2rem; border-radius: 999px; border: none; background: var(--text); color: var(--bg); font-weight: 700; font-size: 1rem; cursor: pointer; }
    .dg-prog { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; margin: 0.3rem 0 0.2rem; }
    .dg-controls { margin: 0.6rem 0; }
    .dg-toggle { display: inline-flex; gap: 0.35rem; flex-wrap: wrap; justify-content: center; }
    .dg-toggle .seg { padding: 0.4rem 0.9rem; border-radius: 999px; border: 1px solid var(--line); background: var(--card2); color: var(--muted); font-weight: 700; font-size: 0.8rem; cursor: pointer; }
    .dg-toggle .seg.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .dg-toggle .seg.locked { opacity: 0.4; cursor: default; }
    .dg-given { color: var(--muted); font-size: 0.9rem; margin-top: 0.5rem; }
    .dg-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; width: 100%; max-width: 360px; margin: 0.4rem auto 0; }
    .dg-grid.rn-grid { grid-template-columns: repeat(4, 1fr); }
    .dg-opt { padding: 0.9rem 0.3rem; font-size: 1rem; font-weight: 700; border-radius: 12px; border: 2px solid var(--line); background: var(--card2); color: var(--text); cursor: pointer; touch-action: manipulation; }
    .dg-opt:active:not(:disabled) { border-color: var(--accent); }
    .dg-opt:disabled { opacity: 0.45; }
    .dg-actions { display: flex; gap: 1.2rem; justify-content: center; margin-top: 0.8rem; }
    .prog-strip { display: flex; gap: 0.5rem; justify-content: center; margin: 0.8rem 0; }
    .prog-slot { min-width: 3rem; padding: 0.5rem 0.3rem; border-radius: 10px; background: var(--card2); border: 1px solid var(--line); color: var(--muted); font-weight: 700; }
    .prog-slot.cur { border-color: var(--accent); color: var(--accent); }
    .prog-slot.past { color: var(--good); }
    .gw-dots { display: flex; gap: 0.4rem; justify-content: center; margin: 1rem 0; }
    .gw-dot { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--card2); border: 1px solid var(--line); }
    .gw-dot.used { background: var(--bad); }
    .gw-dot.cur { background: var(--accent); }
    /* Guess Who — personnel puzzle */
    .gwp-play { margin: 0.4rem 0 0.6rem; }
    .gwp-fields { width: 100%; max-width: 380px; margin: 0.6rem auto 0; display: flex; flex-direction: column; gap: 0.55rem; }
    .gwp-row { display: flex; align-items: center; gap: 0.5rem; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 0.55rem 0.7rem; box-shadow: var(--shadow); }
    .gwp-row.ok { border-color: var(--good); background: rgba(22,163,74,0.08); }
    .gwp-lbl { flex: 0 0 40%; text-align: left; font-weight: 700; font-size: 0.9rem; color: var(--muted); }
    .gwp-row.ok .gwp-lbl { color: var(--text); }
    .gwp-row input { flex: 1; min-width: 0; padding: 0.55rem 0.7rem; border-radius: 10px; border: 1px solid var(--line); background: var(--card2); color: var(--text); font-size: 0.95rem; font-family: inherit; }
    .gwp-go { flex: 0 0 auto; width: 2.2rem; height: 2.2rem; border-radius: 10px; border: none; background: var(--accent); color: #fff; font-weight: 800; font-size: 1rem; cursor: pointer; touch-action: manipulation; }
    .gwp-ans { flex: 1; text-align: left; font-weight: 700; color: var(--good); font-size: 0.95rem; }
    .gwp-reveal { max-width: 360px; margin: 1rem auto 0; color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
    .gwp-hints { width: 100%; max-width: 380px; margin: 0.6rem auto 0.2rem; display: flex; flex-direction: column; gap: 0.4rem; }
    .gwp-hint { background: #fff6e0; border: 1px solid #f2d48a; color: #7a5a10; border-radius: 12px; padding: 0.55rem 0.75rem; font-size: 0.88rem; line-height: 1.35; text-align: left; }
    @media (prefers-color-scheme: dark) { .gwp-hint { background: #2a2410; border-color: #6a5620; color: #e6cd88; } }
    .gw-guess { width: 100%; max-width: 360px; margin: 0.5rem auto; }
    .gw-guess input { width: 100%; padding: 0.9rem 1rem; border-radius: 12px; border: 1px solid var(--line); background: var(--card2); color: var(--text); font-size: 1rem; font-family: inherit; }
    .gw-submit { background: var(--accent) !important; color: #fff !important; border-color: var(--accent) !important; }

    /* =========================================================
       Bottom tab bar (mobile app nav)
       ========================================================= */
    #tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 70;
      display: none; justify-content: space-around; align-items: stretch;
      background: rgba(255,255,255,0.92); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      border-top: 1px solid var(--line);
      padding: 0.4rem 0.3rem calc(env(safe-area-inset-bottom) + 0.35rem);
    }
    body.show-tabs #tabbar { display: flex; }
    body.show-tabs #home, body.show-tabs #daily { padding-bottom: calc(env(safe-area-inset-bottom) + 5.5rem); }
    .tab-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.15rem;
      background: none; border: none; color: var(--muted); font-weight: 700;
      font-size: 0.66rem; letter-spacing: 0.01em; cursor: pointer; touch-action: manipulation;
      padding: 0.35rem 0; border-radius: 12px;
    }
    .tab-btn .tab-ic { font-size: 1.35rem; line-height: 1; }
    .tab-btn .tab-ic svg { width: 25px; height: 25px; display: block; }
    .tab-btn.active { color: var(--accent); }
    .tab-btn .tab-badge { position: relative; }
    .tab-btn .tab-pic { width: 1.55rem; height: 1.55rem; border-radius: 50%; object-fit: cover; border: 2px solid transparent; }
    .tab-btn.active .tab-pic { border-color: var(--accent); }

    /* =========================================================
       Onboarding: welcome + sign-in + add-to-home-screen
       ========================================================= */
    .onboard { position: fixed; inset: 0; z-index: 90; background: linear-gradient(160deg,#ffffff,#e9f6ee);
      display: flex; align-items: center; justify-content: center; padding: 1.4rem; overflow-y: auto; }
    .onboard-card { width: 100%; max-width: 380px; text-align: center; padding: 1rem 0.4rem 2rem; }
    .onboard-logo { width: 4.6rem; height: 4.6rem; margin: 0.5rem auto 1rem; border-radius: 24px;
      background: linear-gradient(135deg,#16a34a,#22c55e); display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem; box-shadow: 0 12px 30px rgba(22,163,74,0.35); }
    .onboard-title { font-size: 2rem; font-weight: 900; letter-spacing: -0.03em; margin: 0 0 0.2rem; }
    .onboard-title .brand { color: var(--accent); }
    .onboard-tag { color: var(--muted); font-size: 0.98rem; font-weight: 600; margin-bottom: 1.3rem; font-style: italic; }
    .onboard-rules { text-align: left; display: flex; flex-direction: column; gap: 0.7rem; margin: 0 auto 1.5rem; max-width: 320px; }
    .onboard-rule { display: flex; align-items: center; gap: 0.8rem; font-size: 0.95rem; line-height: 1.35; }
    .onboard-rule .r-ic { font-size: 1.4rem; width: 2rem; text-align: center; flex: 0 0 auto; }
    .onboard-rule b { color: var(--accent); }
    .google-btn {
      width: 100%; max-width: 320px; margin: 0 auto; display: flex; align-items: center; justify-content: center; gap: 0.6rem;
      padding: 0.95rem; border-radius: 14px; border: none; cursor: pointer; touch-action: manipulation;
      background: linear-gradient(135deg,#16a34a,#22c55e); color: #fff; font-size: 1.05rem; font-weight: 800;
      box-shadow: 0 8px 22px rgba(22,163,74,0.3);
    }
    .google-btn .g-badge { width: 1.5rem; height: 1.5rem; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #16a34a; font-size: 0.95rem; }
    .onboard-skip { display: block; margin: 1rem auto 0; background: none; border: none; color: var(--muted); font-size: 0.9rem; text-decoration: underline; cursor: pointer; }

    /* Add-to-home-screen bottom sheet */
    .sheet-scrim { position: fixed; inset: 0; z-index: 92; background: rgba(20,40,26,0.45); display: flex; align-items: flex-end; justify-content: center; }
    .sheet { width: 100%; max-width: 440px; background: var(--card); border-radius: 22px 22px 0 0; padding: 1.4rem 1.3rem calc(env(safe-area-inset-bottom) + 1.6rem); box-shadow: 0 -8px 30px rgba(20,40,26,0.18); animation: sheetUp 0.28s ease; }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
    .sheet-grip { width: 2.4rem; height: 0.28rem; border-radius: 999px; background: var(--line); margin: 0 auto 1rem; }
    .sheet-title { font-size: 1.25rem; font-weight: 900; text-align: center; letter-spacing: -0.02em; }
    .sheet-sub { color: var(--muted); font-size: 0.92rem; text-align: center; margin: 0.3rem 0 1.1rem; line-height: 1.4; }
    .a2hs-steps { display: flex; flex-direction: column; gap: 0.7rem; margin-bottom: 1.2rem; }
    .a2hs-step { display: flex; align-items: center; gap: 0.8rem; background: var(--card2); border-radius: 14px; padding: 0.8rem 0.9rem; }
    .a2hs-num { width: 1.7rem; height: 1.7rem; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; font-size: 0.9rem; }
    .a2hs-step .a2hs-txt { font-size: 0.92rem; line-height: 1.35; text-align: left; }
    .a2hs-step .a2hs-txt b { color: var(--accent); }
    .a2hs-ic { width: 1.7rem; height: 1.7rem; flex: 0 0 auto; }
    .a2hs-phone { margin: 0 auto 1.1rem; width: 150px; height: 150px; display: block; }
    .sheet-close { width: 100%; padding: 0.95rem; border-radius: 14px; border: none; background: var(--text); color: var(--bg); font-weight: 800; font-size: 1rem; cursor: pointer; }

    /* =========================================================
       Profile page
       ========================================================= */
    .prof { max-width: 440px; margin: 0 auto; }
    .prof-head { display: flex; flex-direction: column; align-items: center; text-align: center; margin: 1.4rem 0 1.6rem; }
    .prof-avatar { width: 5.5rem; height: 5.5rem; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); background: var(--card2); }
    .prof-avatar.ph { display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--muted); }
    .prof-name { font-size: 1.5rem; font-weight: 900; letter-spacing: -0.02em; margin-top: 0.7rem; }
    .prof-sub { color: var(--muted); font-size: 0.9rem; margin-top: 0.2rem; }
    .prof-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.7rem; margin-bottom: 1.4rem; }
    .prof-stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 1rem 0.4rem; text-align: center; box-shadow: var(--shadow); }
    .prof-stat .ps-big { font-size: 1.7rem; font-weight: 900; letter-spacing: -0.02em; }
    .prof-stat .ps-big.streak { color: #f2994a; }
    .prof-stat .ps-lbl { color: var(--muted); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 0.15rem; }
    .prof-edit-btn { width: 100%; padding: 0.85rem; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-weight: 700; cursor: pointer; box-shadow: var(--shadow); }

    /* Streak pill on home */
    .hub-streak { display: inline-flex; align-items: center; gap: 0.35rem; background: rgba(242,153,74,0.14); color: #e07b1a; font-weight: 800; font-size: 0.82rem; padding: 0.3rem 0.75rem; border-radius: 999px; }

    /* Sign-in prompt strip on home for signed-out users */
    .signin-strip { display: flex; align-items: center; gap: 0.8rem; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 0.9rem 1rem; margin-bottom: 1.3rem; box-shadow: var(--shadow); }
    .signin-strip .ss-txt { flex: 1; text-align: left; font-size: 0.9rem; line-height: 1.3; }
    .signin-strip .ss-txt b { display: block; font-size: 1rem; }
    .signin-strip .ss-txt span { color: var(--muted); }
    .signin-strip button { flex: 0 0 auto; background: linear-gradient(135deg,#16a34a,#22c55e); color: #fff; border: none; border-radius: 12px; padding: 0.6rem 1rem; font-weight: 800; font-size: 0.85rem; cursor: pointer; }

    /* Activity calendar on the game-done screen */
    .cal-wrap { width: 100%; max-width: 330px; margin: 1.3rem auto 0.6rem; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 0.9rem 1rem 1rem; box-shadow: var(--shadow); }
    .cal-title { font-weight: 800; font-size: 0.95rem; margin-bottom: 0.7rem; text-align: center; letter-spacing: -0.01em; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.3rem; }
    .cal-dow { font-size: 0.6rem; font-weight: 800; color: var(--muted); text-align: center; text-transform: uppercase; padding-bottom: 0.15rem; }
    .cal-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 700; color: var(--muted); border-radius: 9px; background: var(--card2); }
    .cal-cell.empty { visibility: hidden; background: none; }
    .cal-cell.future { opacity: 0.4; }
    .cal-cell.played { color: #fff; box-shadow: 0 2px 6px rgba(20,40,26,0.15); cursor: pointer; }
    .cal-cell.g1 { background: #ef4444; }
    .cal-cell.g2 { background: #f59e0b; color: #4a2e00; }
    .cal-cell.g3 { background: #facc15; color: #4a3d00; }
    .cal-cell.g4 { background: #16a34a; }
    .cal-cell.today { box-shadow: inset 0 0 0 2px var(--accent); color: var(--accent); }
    .cal-cell.today.played { box-shadow: inset 0 0 0 2px rgba(0,0,0,0.45); color: #fff; }
    .cal-legend { display: flex; align-items: center; gap: 0.25rem; margin-top: 0.7rem; justify-content: center; }
    .cal-leg { width: 0.85rem; height: 0.85rem; border-radius: 4px; }
    .cal-leg.g1 { background: #ef4444; } .cal-leg.g2 { background: #f59e0b; } .cal-leg.g3 { background: #facc15; } .cal-leg.g4 { background: #16a34a; }
    .cal-leg-txt { color: var(--muted); font-size: 0.7rem; font-weight: 700; margin-left: 0.4rem; }
    .cal-today { width: 100%; max-width: 330px; margin: 0.2rem auto 0.4rem; }
    .cal-score-row { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0.2rem; border-bottom: 1px solid var(--line); font-size: 0.92rem; }
    .cal-score-row:last-child { border-bottom: none; }
    .cal-score-row b { color: var(--accent); font-variant-numeric: tabular-nums; }

    /* Toast (streak / welcome-back notifications) */
    .toast {
      position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 5.4rem);
      transform: translateX(-50%) translateY(16px); z-index: 96;
      background: var(--text); color: #fff; font-weight: 800; font-size: 0.9rem;
      padding: 0.75rem 1.15rem; border-radius: 999px; box-shadow: 0 10px 28px rgba(20,40,26,0.28);
      opacity: 0; pointer-events: none; transition: opacity 0.28s ease, transform 0.28s ease;
      max-width: 92vw; text-align: center; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* =========================================================
       Testing Battery — deliberately plain. The running screen is
       instrument panel, not arcade cabinet: nothing moves, nothing
       flashes, nothing hints at how it is going.
       ========================================================= */
    .bt { max-width: 720px; margin: 0 auto; }
    .bt-title { font-size: 2rem; font-weight: 800; letter-spacing: -0.025em; margin: 0.4rem 0 0.4rem; }
    .bt-sub { color: var(--muted); font-size: 0.98rem; line-height: 1.55; margin: 0 0 1.4rem; }
    .bt-note { color: var(--muted); font-size: 0.88rem; line-height: 1.5; margin: 0.4rem 0 0.8rem; }
    .bt-note.center { text-align: center; max-width: 460px; margin: 0.8rem auto 1.2rem; }
    .bt-back { background: none; border: none; color: var(--muted); font-size: 0.9rem; font-weight: 600;
      cursor: pointer; padding: 0.5rem 0; margin-bottom: 0.2rem; }
    .bt-foot { color: var(--muted); font-size: 0.85rem; line-height: 1.7; margin-top: 1.6rem;
      padding-top: 1rem; border-top: 1px solid var(--line); }

    .bt-cards { display: flex; flex-direction: column; gap: 0.7rem; }
    .bt-card { display: block; width: 100%; text-align: left; background: var(--card);
      border: 1px solid var(--line); border-radius: 16px; padding: 1.05rem 1.2rem; cursor: pointer;
      color: var(--text); box-shadow: var(--shadow); transition: border-color 0.12s, transform 0.1s; }
    .bt-card:active { transform: translateY(1px); }
    .bt-card:hover { border-color: var(--accent); }
    .bt-card.go { border-color: var(--accent); background: linear-gradient(135deg, rgba(22,163,74,0.07), rgba(34,197,94,0.03)); }
    .bt-card-t { font-weight: 700; font-size: 1.12rem; }
    .bt-card-b { color: var(--muted); font-size: 0.88rem; line-height: 1.45; margin-top: 0.25rem; }

    .bt-panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 1.1rem 1.2rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
    .bt-panel-t { font-weight: 700; font-size: 0.78rem; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--muted); margin-bottom: 0.6rem; }

    .bt-btn { padding: 0.7rem 1.2rem; border-radius: 12px; border: 1px solid var(--line);
      background: var(--card2); color: var(--text); font-family: inherit; font-size: 0.95rem;
      font-weight: 600; cursor: pointer; margin: 0.2rem 0.4rem 0.2rem 0; }
    .bt-btn:hover { border-color: var(--accent); }
    .bt-btn.primary { background: linear-gradient(135deg,#16a34a,#22c55e); color: #fff; border: none;
      box-shadow: 0 6px 18px rgba(22,163,74,0.25); }
    .bt-btn.ghost { background: none; border: none; color: var(--muted); text-decoration: underline; }
    .bt-btn.wide { display: block; width: 100%; margin: 1.2rem 0 0; padding: 1rem; font-size: 1.05rem; }
    .bt-btn.small { padding: 0.45rem 0.9rem; font-size: 0.85rem; }
    .bt-row { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; margin-top: 0.5rem; }
    .bt-row.center { justify-content: center; }

    .bt-resume { background: #fff8e6; border: 1px solid #f0d493; color: #7a5a10; border-radius: 14px;
      padding: 0.9rem 1.1rem; margin-bottom: 1.2rem; font-size: 0.92rem; line-height: 1.5; }

    .bt-check { display: flex; align-items: center; gap: 0.55rem; color: var(--text);
      font-size: 0.92rem; margin: 0.7rem 0 0.2rem; cursor: pointer; line-height: 1.45; }
    .bt-check input { width: 1.1rem; height: 1.1rem; accent-color: var(--accent); flex: 0 0 auto; }

    .bt-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.8rem; }
    .bt-fields label, .bt-field-wide { display: flex; flex-direction: column; gap: 0.3rem;
      color: var(--muted); font-size: 0.82rem; font-weight: 600; }
    .bt-field-wide { margin-top: 0.8rem; }
    .bt-fields input, .bt-fields select, .bt-input, .bt-field-wide textarea {
      padding: 0.65rem 0.8rem; border-radius: 10px; border: 1px solid var(--line);
